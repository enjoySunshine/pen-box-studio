<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Line box preview</title>
  <style>
    body { margin: 2rem; background: #0b1020; color: #e5e7eb; font: 14px/1.5 system-ui, sans-serif; }
    figure { margin: 0 0 2rem; padding: 1rem; background: #111827; border-radius: 12px; }
    img { max-width: 100%; height: auto; background: #111827; }
    code { color: #7dd3fc; }
  </style>
</head>
<body>
  <figure>
    <figcaption><code>abc ef</code> — edges 94 -20 5832 1567, advance 5744, viewBox <code>94 -1567 5738 1587</code></figcaption>
    <img src="./out.svg" alt="Preview of abc-ef">
  </figure>
  <figure>
    <figcaption><code>combining acute U+0301</code> — edges -755 1241 -362 1569, advance 0, viewBox <code>-755 -1569 393 328</code></figcaption>
    <img src="./out-acute.svg" alt="Preview of combining-acute">
  </figure>
</body>
</html>
